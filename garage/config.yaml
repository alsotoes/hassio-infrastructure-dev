---
name: Garage S3 Storage
version: "0.1.8"
slug: garage
description: S3-compatible distributed object storage for Home Assistant
url: https://github.com/alsotoes/hassio-infrastructure-dev/tree/main/garage
init: false
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
startup: system
ports:
  3900/tcp: 3900
  3901/tcp: 3901
  3902/tcp: 3902
  3903/tcp: 3903
ports_description:
  3900/tcp: "S3 API endpoint"
  3901/tcp: "RPC cluster communication"
  3902/tcp: "S3 Web console"
  3903/tcp: "Admin/metrics API"
webui: "http://[HOST]:[PORT:3902]/"
ingress: true
ingress_port: 3902
map:
  - data:rw
apparmor: false
options:
  mode: "single-node"
  rpc_bind_addr: "[::]:3901"
  rpc_public_addr: ""
  s3_api_bind_addr: "[::]:3900"
  s3_web_bind_addr: "[::]:3902"
  admin_bind_addr: "[::]:3903"
  s3_region: "garage"
  s3_root_domain: ".s3.garage.local"
  s3_web_root_domain: ".web.garage.local"
  s3_web_index: "index.html"
  metadata_dir: "/data/meta"
  data_dir: "/data/data"
  db_engine: "lmdb"
  replication_factor: 1
  rpc_secret: ""
  admin_token: ""
  metrics_token: ""
  bootstrap_peers: []
  log_level: "info"
  compression_level: 1
  block_size: "1M"
schema:
  mode: "list(single-node|cluster)"
  rpc_bind_addr: "str"
  rpc_public_addr: "str?"
  s3_api_bind_addr: "str"
  s3_web_bind_addr: "str"
  admin_bind_addr: "str"
  s3_region: "str"
  s3_root_domain: "str"
  s3_web_root_domain: "str"
  s3_web_index: "str?"
  metadata_dir: "str"
  data_dir: "str"
  db_engine: "list(lmdb|sqlite)"
  replication_factor: "int(1,3)"
  rpc_secret: "password?"
  admin_token: "password?"
  metrics_token: "password?"
  bootstrap_peers:
    - "str"
  log_level: "list(debug|info|warn|error)"
  compression_level: "int(0,3)"
  block_size: "str"